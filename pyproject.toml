[project]
name = "cite-rag"
version = "0.1.0"
description = "Small RAG pipeline with verified citations, refusal, and a measured evaluation suite"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "typer>=0.27.3",
]

[project.scripts]
cite-rag = "cite_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cite_rag"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"src/cite_rag/cli.py" = ["B008"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
